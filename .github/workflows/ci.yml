name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run prometeo validate-data

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      # Next.js 16 route/layout globals (PageProps, LayoutProps) are emitted by
      # `next typegen`; bare `tsc --noEmit` fails without them on a clean runner.
      # Official order: next typegen && tsc --noEmit
      # https://nextjs.org/docs/app/api-reference/cli/next#next-typegen-options
      - run: pnpm --filter @prometeo/frontend exec next typegen
      - run: pnpm typecheck:web
      - run: pnpm build:web
